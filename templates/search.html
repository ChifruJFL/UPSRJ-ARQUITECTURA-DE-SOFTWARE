<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Search - Users & Groups</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif; padding:20px}
    label{display:block;margin-top:8px}
  </style>
</head>
<body>
  <h1>Search</h1>

  <form method="POST" action="/search" id="searchForm">
    <label>
      <input type="radio" name="type" value="user" id="rUser" checked> Search Users
    </label>
    <label>
      <input type="radio" name="type" value="group" id="rGroup"> Search Groups
    </label>

    <div id="byName">
      <label>By name / keyword:
        <input type="text" name="keyword" placeholder="Enter name or keyword">
      </label>
    </div>

    <div id="byId" style="margin-top:8px">
      <label>Or by ID:
        <input type="number" name="id" placeholder="Enter ID">
      </label>
    </div>

    <br>
    <button type="submit">Search</button>
  </form>

  <script>
    // optional: could show/hide fields depending on type, kept simple
    const rUser = document.getElementById('rUser');
    const rGroup = document.getElementById('rGroup');
    const form = document.getElementById('searchForm');
  </script>
</body>
</html>
